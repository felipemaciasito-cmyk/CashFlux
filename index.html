<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CashFlux</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CashFlux">
<meta name="theme-color" content="#F3F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C16" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@property --accent{syntax:'<color>';inherits:true;initial-value:#5856E8}
@property --accent2{syntax:'<color>';inherits:true;initial-value:#9A6CFF}
:root{transition:--accent .5s ease,--accent2 .5s ease}
:root{
  --bg:#F3F4F9;--surface:#FFFFFF;--surface2:#EBEDF5;--text:#14152A;--muted:#6C6F88;--line:rgba(20,21,42,.08);
  --accent:#5856E8;--accent2:#9A6CFF;--pos:#11A26A;--neg:#E0464E;--warn:#D9952F;--shadow:0 1px 2px rgba(20,21,42,.04),0 8px 24px rgba(20,21,42,.06);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0C16;--surface:#161729;--surface2:#202138;--text:#F1F1F9;--muted:#8E90AB;--line:rgba(255,255,255,.07);
  --accent:#7F7DFF;--accent2:#B48CFF;--pos:#3AD48A;--neg:#FF6A70;--warn:#F2B256;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0B0C16;--surface:#161729;--surface2:#202138;--text:#F1F1F9;--muted:#8E90AB;--line:rgba(255,255,255,.07);
  --accent:#7F7DFF;--accent2:#B48CFF;--pos:#3AD48A;--neg:#FF6A70;--warn:#F2B256;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{overflow-x:hidden;overscroll-behavior-x:none;max-width:100%}
.app{overflow-x:clip}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:12px 18px 110px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 4px}
.month{font-weight:700;font-size:15px;text-transform:capitalize}
.iconbtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
/* Hero */
.hero{position:relative;padding:26px 4px 22px;text-align:center}
.hero::before{content:"";position:absolute;inset:-10px -40px auto;height:200px;background:radial-gradient(60% 70% at 50% 40%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);z-index:-1;pointer-events:none}
.hero .lbl{color:var(--muted);font-size:13px;font-weight:600}
.big{font-size:clamp(40px,11vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:6px 0 10px}
.big .cents{font-size:.5em;letter-spacing:-.01em;opacity:.55}
.pill{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:13px;font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--muted)}
/* Actions */
.actions{display:flex;gap:10px;justify-content:center;margin:18px 0 6px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font-size:12px;font-weight:600;color:var(--text);width:76px}
.act span.ic{width:50px;height:50px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .15s}
.act:active span.ic{transform:scale(.93)}
.act.primary span.ic{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.act svg{width:20px;height:20px}
/* Sections */
.sec{margin-top:24px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px}
.sech h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:12px}
/* Account cards */
.scroller{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 4px 12px;margin:0 -4px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.acc{flex:0 0 72%;max-width:280px;scroll-snap-align:start;border-radius:22px;padding:16px 18px;color:#fff;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;border:0;text-align:left;position:relative;overflow:hidden}
.acc::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.acc .bank{font-size:12px;opacity:.85;font-weight:600}
.acc .nm{font-weight:700;font-size:15px}
.acc .bal{font-size:24px;font-weight:800;letter-spacing:-.02em}
.acc.add{background:var(--surface);color:var(--muted);box-shadow:var(--shadow);align-items:center;justify-content:center;flex-basis:40%;font-weight:600}
.acc.add::after{display:none}
.g0{background:linear-gradient(140deg,#4F4CE6,#8D5CF6)}.g1{background:linear-gradient(140deg,#0E9F8E,#2BC48A)}
.g2{background:linear-gradient(140deg,#E2575E,#F2945B)}.g3{background:linear-gradient(140deg,#1C2340,#3B4677)}
.g4{background:linear-gradient(140deg,#2C7BE5,#45B3F2)}.g5{background:linear-gradient(140deg,#B4469B,#E36FA6)}
/* Rows */
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.av{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--surface2)}
.rmain{flex:1;min-width:0}
.rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12.5px;color:var(--muted)}
.ramt{font-weight:700;white-space:nowrap}
.rowbtn{width:100%;border:0;background:none;text-align:left;padding:0}
/* Budget */
.daily{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.daily .v{font-size:30px;font-weight:800;letter-spacing:-.02em}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.over>i{background:var(--neg)}
.bar.warn>i{background:var(--warn)}
.flow{display:grid;gap:2px}
.flow .l{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.flow .l.tot{border:0;font-weight:800;font-size:17px;padding-top:12px}
.cat{padding:10px 0}
.cat .h{display:flex;justify-content:space-between;font-size:14px}
.cat .h b{font-weight:600}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--neg) 12%,var(--surface));color:var(--text);font-size:14px;margin-top:10px}
.alert.ok{background:color-mix(in srgb,var(--pos) 12%,var(--surface))}
.alert.info{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--surface2)}
.btn.p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn.d{background:color-mix(in srgb,var(--neg) 14%,var(--surface));color:var(--neg)}
.btn.w{width:100%}
.btn:disabled{opacity:.5}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}
nav.tabs .in{display:flex;max-width:560px;width:100%;justify-content:space-around}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 8px;min-width:60px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(5,6,15,.45);opacity:0;transition:opacity .25s;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.85,.25,1);z-index:41;max-width:560px;margin:0 auto}
.open .scrim{opacity:1}.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--surface2);margin:0 auto 14px}
.sheet h3{margin:0 0 14px;font-size:20px;letter-spacing:-.01em}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.f input,.f select{font-size:16px;width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--surface2);outline:none}
.f input:focus,.f select:focus{border-color:var(--accent)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:center;font-size:14px;margin:6px 0 12px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.amtin{font-size:34px!important;font-weight:800;text-align:center;letter-spacing:-.02em;background:transparent!important;border:0!important}
.drop{border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:18px;padding:22px;text-align:center;color:var(--muted);display:block;cursor:pointer}
.drop b{color:var(--text)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:62px;height:62px;object-fit:cover;border-radius:12px}
.irow{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.irow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.irow select{font-size:12px;border:0;background:var(--surface2);border-radius:8px;padding:3px 6px;margin-top:3px;max-width:100%}
.dup{opacity:.55}
.mini{width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:16px;outline:none;min-width:0}
.mini:focus{border-color:var(--accent)}
input.mini[data-f=label]{font-weight:600}
.ir2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.sgn{flex:0 0 36px;border:0;border-radius:10px;background:var(--surface2);font-weight:800;font-size:17px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);animation:sp .8s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;transition:all .25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:Manrope,sans-serif}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td{padding:8px 2px;border-bottom:1px solid var(--line)}
.tbl td:last-child{text-align:right;font-weight:700}
.goal{padding:10px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border:0}
.hidden-amt .amt{filter:blur(7px);transition:filter .2s}
/* Carrousel de l'accueil */
.wash{position:fixed;left:0;right:0;top:0;height:480px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 20%,transparent),transparent);pointer-events:none;z-index:-1}
.hscroll{position:relative;display:flex;overscroll-behavior-x:contain;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:8px 0 14px;scrollbar-width:none;--cw:min(78%,300px)}
.hscroll::-webkit-scrollbar{display:none}
.hscroll::before,.hscroll::after{content:"";flex:0 0 max(0px,calc((100% - var(--cw))/2 - 12px))}
.hscroll .hcard{flex:0 0 var(--cw);max-width:none;scroll-snap-align:center;cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s,box-shadow .35s}
.hscroll .hcard:not(.on){transform:scale(.92);opacity:.6}
.hscroll .hcard.on{box-shadow:0 16px 34px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
.hcard.all{background:#15162A;border:1px solid rgba(255,255,255,.14)}
.hcard.all::after{background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.hcard.all .alltitle{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
.hcard .cdots{display:flex;gap:5px;margin-top:8px}.hcard .cdots i{width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7)}
.hscroll.reorder{scroll-snap-type:none}
.hscroll.reorder .hcard{transform:none;opacity:1}
.hscroll.reorder .hcard[data-acc]{outline:2px dashed rgba(255,255,255,.6);outline-offset:-7px;touch-action:none}
.hcard.dragging{z-index:5;transition:none!important;box-shadow:0 24px 44px -14px rgba(0,0,0,.5)!important}
.hcard.shift{transition:transform .22s ease!important}
.hcard .mvs{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.hcard .mvs button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.25);color:#fff;font-size:17px;font-weight:800;line-height:1}
.hcard .mvs button:disabled{opacity:.3}
.reobar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:16px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-size:13.5px;font-weight:600;margin-bottom:6px}
.reobar[hidden]{display:none}
.cdotsbar{display:flex;justify-content:center;gap:6px;margin-top:2px}
.cdotsbar i{width:6px;height:6px;border-radius:99px;background:color-mix(in srgb,var(--text) 18%,transparent);transition:all .3s}
.cdotsbar i.on{width:18px;background:var(--accent)}
.fadein{animation:fadein .28s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
/* Encadré d'opérations assorti à la carte */
.txcard{position:relative;overflow:hidden;color:#fff;border-radius:22px;padding:4px 16px;box-shadow:0 16px 34px -14px color-mix(in srgb,var(--accent) 65%,transparent);transition:box-shadow .5s}
.txcard::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.txcard.all{border:1px solid rgba(255,255,255,.14)}
.txcard>*{position:relative;z-index:1}
.txcard .rs{color:rgba(255,255,255,.72)}
.txcard .av{background:rgba(255,255,255,.18)}
.txcard .ramt,.txcard .ramt.pos{color:#fff}
.txcard .ramt.pos{background:rgba(255,255,255,.2);padding:2px 8px;border-radius:99px}
.txcard .rowbtn{color:#fff}
.txcard .row{border-bottom:1px solid rgba(255,255,255,.14)}
.txcard .rowbtn:last-child .row{border-bottom:0}
.txcard .empty,.txcard .empty b{color:#fff}
/* Catégories */
div.rowbtn{cursor:pointer}
.avbtn{border:0;padding:0;color:inherit;position:relative;cursor:pointer;transition:transform .15s}
.avbtn:active{transform:scale(.9)}
.avbtn.todo{font-weight:800;color:var(--neg);background:color-mix(in srgb,var(--neg) 10%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--neg) 45%,transparent)}
.avbtn.todo::after{content:"";position:absolute;top:-1px;right:-1px;width:12px;height:12px;border-radius:50%;background:var(--neg);border:2px solid var(--surface)}
.todotxt{color:var(--neg);font-weight:700}
.txcard .avbtn.todo{color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.txcard .avbtn.todo::after{border-color:#fff;background:#FF4D5A}
.txcard .todotxt{color:#fff;text-decoration:underline;text-decoration-color:#FF4D5A;text-decoration-thickness:2px}
.todobar{width:100%;display:flex;align-items:center;gap:10px;border:0;margin-bottom:10px;padding:11px 14px;border-radius:16px;background:color-mix(in srgb,var(--neg) 11%,var(--surface));font-weight:700;font-size:14px;text-align:left;box-shadow:var(--shadow)}
.todobar .dot{width:10px;height:10px;border-radius:50%;background:var(--neg);flex:0 0 10px}
.todobar .go{margin-left:auto;color:var(--neg);font-size:13px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:16px;border:1.5px solid transparent;background:var(--surface2);text-align:center;min-height:84px;justify-content:center}
.ctile .ci{font-size:22px;line-height:1}.ctile .cn{font-size:12.5px;font-weight:700;line-height:1.2}.ctile .cd{font-size:10.5px;color:var(--muted);line-height:1.2}
.ctile.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.ctile:active{transform:scale(.96)}
.mv{width:26px;height:20px;border:0;border-radius:6px;background:var(--surface);font-size:10px;color:var(--muted);padding:0}
.mv:disabled{opacity:.3}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}
.emojis button{width:38px;height:38px;border-radius:10px;border:0;background:var(--surface2);font-size:19px;padding:0}
button.cat{display:block;width:100%;text-align:left}
/* Load moment */
@media (prefers-reduced-motion:no-preference){
  .intro .hero .big{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .intro .acc{animation:slidein .6s cubic-bezier(.2,.8,.2,1) both}
  .intro .acc:nth-child(2){animation-delay:.06s}.intro .acc:nth-child(3){animation-delay:.12s}.intro .acc:nth-child(4){animation-delay:.18s}
}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes slidein{from{opacity:0;transform:translateX(30px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <div class="month" id="monthLbl"></div>
    <div style="display:flex;gap:8px">
      <button class="iconbtn" id="eyeBtn" aria-label="Masquer les montants"></button>
    </div>
  </div>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="backupIn" accept="application/json,.json" hidden>

<script>

function guessCat(label,amount){
 const k=labelKey(label);
 if(k&&S.rules&&isKnownCat(S.rules[k])) return S.rules[k];
 for(const [c,r] of KEYWORDS) if(r.test(label||"")&&isKnownCat(c)) return c;
 return amount>0?"Revenus":"";
}

/* ---------- Calculs budget & prévision ---------- */
function plan(){
 const inc=S.recurring.filter(r=>r.kind==="income").reduce((s,r)=>s+r.amount,0);
 const chg=S.recurring.filter(r=>r.kind==="charge").reduce((s,r)=>s+r.amount,0);
 const save=Math.max(0,(inc-chg))*S.settings.savingsRate/100;
 const free=Math.max(0,inc-chg-save);
 const tw=S.cats.reduce((s,c)=>s+(+c.weight||0),0)||1;
 const per={};S.cats.forEach(c=>per[c.name]=free*(+c.weight||0)/tw);
 return {inc,chg,save,free,per};
}
function spentIn(month){
 // Chaque débit compte dans sa catégorie ; ceux « à classer » comptent aussi (clé __todo) pour ne rien oublier
 const out={__todo:0};S.cats.forEach(c=>out[c.name]=0);
 S.tx.forEach(t=>{if(ym(t.date)!==month||t.amount>=0)return;if(isBudgetCat(t.category))out[t.category]+=-t.amount;else if(needsCat(t))out.__todo+=-t.amount});
 return out;
}
function avgVariable(){
 const now=new Date();let tot=0,n=0;
 for(let i=1;i<=3;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  if(S.tx.some(t=>ym(t.date)===k)){tot+=Object.values(spentIn(k)).reduce((a,b)=>a+b,0);n++}}
 return n?tot/n:null;
}
function thisMonth(){
 const d=new Date(),y=d.getFullYear(),m=d.getMonth(),day=d.getDate(),dim=daysInMonth(y,m);
 const p=plan(),spent=spentIn(curYM()),spentTot=Object.values(spent).reduce((a,b)=>a+b,0);
 const remainVar=Math.max(0,p.free-spentTot);
 const daysLeft=dim-day+1;
 const futInc=S.recurring.filter(r=>r.kind==="income"&&Math.min(r.day,dim)>day).reduce((s,r)=>s+r.amount,0);
 const futChg=S.recurring.filter(r=>r.kind==="charge"&&Math.min(r.day,dim)>day).reduce((s,r)=>s+r.amount,0);
 const endEst=totalBalance()+futInc-futChg-remainVar;
 return {p,spent,spentTot,remainVar,daysLeft,perDay:remainVar/daysLeft,endEst,futInc,futChg};
}
function forecast(n){
 const tm=thisMonth(),p=tm.p,avg=avgVariable(),varEst=avg!=null?(avg+p.free)/2:p.free;
 const d=new Date(),out=[{label:"Auj.",v:totalBalance()},{label:monthName(d.getFullYear(),d.getMonth(),true).replace(".",""),v:tm.endEst,end:true}];
 let v=tm.endEst;
 for(let i=1;i<n;i++){v+=p.inc-p.chg-varEst;const md=new Date(d.getFullYear(),d.getMonth()+i,1);out.push({label:monthName(md.getFullYear(),md.getMonth(),true).replace(".",""),v,end:true})}
 return {pts:out,varEst,avg};
}
function overdraftRisks(){
 const d=new Date(),y=d.getFullYear(),m=d.getMonth(),day=d.getDate(),dim=daysInMonth(y,m),risks=[];
 S.accounts.forEach(a=>{
  let bal=accBalance(a),min=bal,minDay=day;
  const ev=S.recurring.filter(r=>r.accountId===a.id&&Math.min(r.day,dim)>day).sort((x,z)=>x.day-z.day);
  ev.forEach(r=>{bal+=r.kind==="income"?r.amount:-r.amount;if(bal<min){min=bal;minDay=Math.min(r.day,dim)}});
  if(min<0) risks.push({a,min,day:minDay});
 });
 return risks;
}
function detectSubs(){
 const groups={};
 S.tx.filter(t=>t.amount<0&&t.category!=="Virement interne").forEach(t=>{
  const key=t.label.toLowerCase().replace(/[0-9]{2,}|\s+/g," ").trim().slice(0,18)+"|"+Math.round(-t.amount);
  (groups[key]=groups[key]||[]).push(t);
 });
 const known=S.recurring.map(r=>r.label.toLowerCase());
 return Object.values(groups).filter(g=>new Set(g.map(t=>ym(t.date))).size>=2)
  .map(g=>g[g.length-1]).filter(t=>!known.some(k=>t.label.toLowerCase().includes(k)||k.includes(t.label.toLowerCase().slice(0,8)))).slice(0,5);
}

function centerCard(el,smooth){

function nearestCard(sc){
 const mid=sc.scrollLeft+sc.clientWidth/2;let best=null,bd=1e9;
 sc.querySelectorAll(".hcard").forEach(c=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);if(d<bd){bd=d;best=c}});

function setupCarousel(){
 const sc=document.getElementById("hScroll");if(!sc)return;
 centerCard(sc.querySelector(`[data-hcard="${CSS.escape(homeSel)}"]`),false);
 markSel();
 sc.addEventListener("scroll",()=>{if(drag)return;cancelAnimationFrame(carRaf);carRaf=requestAnimationFrame(()=>{const c=nearestCard(sc);if(c)selectCard(c.dataset.hcard)})},{passive:true});
 let lp=null;
 const start=(x,y,target)=>{
  const card=target.closest(".hcard[data-acc]");if(!card||target.closest("button"))return;
  if(reorderMode){beginDrag(card,x);return}
  lp={x,y,card,t:setTimeout(()=>{reorderMode=true;sc.classList.add("reorder");const b=document.getElementById("reoBar");if(b)b.hidden=false;beginDrag(card,lp.x)},450)};
 };
 const move=(x,y,ev)=>{
  if(drag){ev.preventDefault();drag.lastX=x;dragTo(x);return}
  if(lp){if(Math.abs(x-lp.x0)>10||Math.abs(y-lp.y0)>10){clearTimeout(lp.t);lp=null}else lp.x=x}
 };
 const end=()=>{if(lp){clearTimeout(lp.t);lp=null}if(drag)endDrag()};
 sc.addEventListener("touchstart",ev=>{const t=ev.touches[0];start(t.clientX,t.clientY,ev.target);if(lp){lp.x0=t.clientX;lp.y0=t.clientY}},{passive:true});
 sc.addEventListener("touchmove",ev=>{const t=ev.touches[0];move(t.clientX,t.clientY,ev)},{passive:false});
 sc.addEventListener("touchend",end);sc.addEventListener("touchcancel",end);
 sc.addEventListener("pointerdown",ev=>{if(ev.pointerType!=="mouse"||!reorderMode)return;start(ev.clientX,ev.clientY,ev.target);
  const mm=e=>move(e.clientX,e.clientY,e),mu=()=>{end();removeEventListener("pointermove",mm);removeEventListener("pointerup",mu)};
  addEventListener("pointermove",mm);addEventListener("pointerup",mu)});
}
function beginDrag(card,x){
 const sc=document.getElementById("hScroll"),cards=[...sc.querySelectorAll(".hcard[data-acc]")];
 drag={sc,card,cards,idx:cards.indexOf(card),to:cards.indexOf(card),x0:x,lastX:x,s0:sc.scrollLeft,w:card.offsetWidth+12};
 card.classList.add("dragging");cards.forEach(c=>{if(c!==card)c.classList.add("shift")});
 dragTo(x);autoScroll();
}
function dragTo(x){
 const d=drag;if(!d)return;
 const dx=x-d.x0+(d.sc.scrollLeft-d.s0);
 d.card.style.transform=`translateX(${dx}px) scale(1.04)`;
 d.to=Math.max(0,Math.min(d.cards.length-1,d.idx+Math.round(dx/d.w)));
 d.cards.forEach((c,j)=>{if(c===d.card)return;const sh=(j>d.idx&&j<=d.to)?-d.w:(j<d.idx&&j>=d.to)?d.w:0;c.style.transform=sh?`translateX(${sh}px)`:""});
}
function autoScroll(){
 const d=drag;if(!d)return;
 const r=d.sc.getBoundingClientRect(),edge=60;
 const v=d.lastX<r.left+edge?-9:d.lastX>r.right-edge?9:0;
 if(v){d.sc.scrollLeft+=v;dragTo(d.lastX)}
 d.raf=requestAnimationFrame(autoScroll);
}
function endDrag(){
 const d=drag;drag=null;cancelAnimationFrame(d.raf);suppressClick=Date.now()+450;
 if(d.to!==d.idx){const [m]=S.accounts.splice(d.idx,1);S.accounts.splice(d.to,0,m);save()}
 homeSel=d.card.dataset.acc;try{localStorage.setItem("cashflux-homecard",homeSel)}catch(e){}
 render();
}

function lineChart(pts){

 const line=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
 const area=line+` L${x(pts.length-1)} ${H-pb} L${x(0)} ${H-pb} Z`;
 const z=y(0);
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Projection du solde total">

 ${z>pt&&z<H-pb?`<line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--neg)" stroke-dasharray="3 4" stroke-width="1" opacity=".6"/>`:""}
 <path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
 ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===0?4:3}" fill="${p.v<0?"var(--neg)":"var(--surface)"}" stroke="${p.v<0?"var(--neg)":"var(--accent)"}" stroke-width="2"/><text x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}">${esc(p.label)}</text>`).join("")}
 </svg>`;
}

const TESS_URL="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let ocrWorker=null,ocrProgress=()=>{};
function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("script"));document.head.append(s)})}
async function getWorker(){
 await loadScript(TESS_URL);
 if(!ocrWorker) ocrWorker=await Tesseract.createWorker(["fra","eng"],1,{logger:m=>ocrProgress(m)});
 return ocrWorker;
}
/* Agrandit, passe en niveaux de gris, inverse les thèmes sombres et renforce le contraste */
function prepImage(file){
 return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   const scale=Math.min(2.5,Math.max(1,1800/img.width)),c=document.createElement("canvas");
   c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
   const x=c.getContext("2d");x.imageSmoothingQuality="high";x.drawImage(img,0,0,c.width,c.height);
   const d=x.getImageData(0,0,c.width,c.height),p=d.data;let sum=0;
   for(let i=0;i<p.length;i+=4){const g=.299*p[i]+.587*p[i+1]+.114*p[i+2];p[i]=g;sum+=g}
   const dark=sum/(p.length/4)<110;
   for(let i=0;i<p.length;i+=4){let g=p[i];if(dark)g=255-g;g=(g-128)*1.5+140;g=g<0?0:g>255?255:g;p[i]=p[i+1]=p[i+2]=g}
   x.putImageData(d,0,0);URL.revokeObjectURL(url);res(c);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("image"))};
  img.src=url;
 });
}

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const MONTHS=[["janv",1],["jan",1],["fevr",2],["fev",2],["feb",2],["mars",3],["mar",3],["avr",4],["apr",4],["mai",5],["may",5],["juin",6],["jun",6],["juil",7],["jul",7],["aout",8],["aou",8],["aug",8],["sept",9],["sep",9],["oct",10],["nov",11],["dec",12]];
const monthOf=w=>{w=norm(w);for(const [k,m] of MONTHS) if(w.startsWith(k)) return m;return 0};
const iso=(y,m,d)=>y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
const WEEKDAYS=/\b(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|monday|tuesday|wednesday|thursday|friday|saturday|sunday|lun|mar|mer|jeu|ven|sam|dim)\.?\b/gi;
function fixYear(m,d,y){
 const now=new Date();
 if(m<1||m>12||d<1||d>31) return null;
 if(y){y=+y;if(y<100)y+=2000}else{y=now.getFullYear();if(new Date(y,m-1,d)>now)y--}
 return iso(y,m,d);
}
function findDate(line){
 const n=norm(line);
 if(/aujourd.?hui|\btoday\b/.test(n)) return {date:todayISO(),re:/aujourd.?hui|today/i};
 if(/\b(hier|yesterday)\b/.test(n)){const d=new Date();d.setDate(d.getDate()-1);return {date:iso(d.getFullYear(),d.getMonth()+1,d.getDate()),re:/hier|yesterday/i}}
 let m=n.match(/\b(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?\b/);
 if(m&&!/[.,]\d{2}\s*(€|eur)/.test(n.slice(m.index,m.index+m[0].length+5))){const r=fixYear(+m[2],+m[1],m[3]);if(r) return {date:r,re:new RegExp(m[0].replace(/[.\/]/g,"[./]"))}}
 m=n.match(/\b(\d{1,2})(?:er)?\s+([a-z]{3,9})\.?(?:\s+(\d{4}))?/);
 if(m&&monthOf(m[2])){const r=fixYear(monthOf(m[2]),+m[1],m[3]);if(r) return {date:r,re:new RegExp("\\b"+m[1]+"(?:er)?\\s+\\S+"+(m[3]?"\\s+"+m[3]:""),"i")}}
 m=n.match(/\b([a-z]{3,9})\.?\s+(\d{1,2})(?:,?\s+(\d{4}))?\b/);
 if(m&&monthOf(m[1])){const r=fixYear(monthOf(m[1]),+m[2],m[3]);if(r) return {date:r,re:new RegExp("\\S+\\.?\\s+"+m[2]+(m[3]?",?\\s+"+m[3]:""),"i")}}
 return null;
}
const AMT_RE=/([+\-−–]?)\s*(€\s*)?(\d{1,3}(?:[ \u00a0\u202f.,']\d{3})+|\d+)\s*([.,])\s*(\d{2})(?!\d)\s*(€|eur)?/gi;
function findAmount(line){
 let last=null,m;AMT_RE.lastIndex=0;
 while((m=AMT_RE.exec(line))) last=m;
 if(!last) return null;
 const v=parseFloat(last[3].replace(/[^\d]/g,"")+"."+last[5]);
 const sign=last[1]==="+"?1:last[1]?-1:0;
 return {value:v,sign,raw:last[0]};
}
const NOISE=/^(transactions?|operations?|mouvements|voir tout|tout voir|see all|recent|historique|a venir|en attente|pending|filtrer|rechercher|search|mes comptes|accueil|home|depenses|revenus)\b/;
const BAL_RE=/\b(solde|disponible|balance|available)\b/;
function cleanLabel(s){return s.replace(/[|*•·_>«»"“”]+/g," ").replace(/\s{2,}/g," ").replace(/^[^a-z0-9à-ÿ]+|[^a-z0-9à-ÿ)]+$/gi,"").trim()}
function parseOcr(text){
 const lines=text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
 let curDate=null,labels=[],balance=null;const txs=[];
 for(const line of lines){
  const n=norm(line),dt=findDate(line),am=findAmount(line);
  if(am&&BAL_RE.test(n)){if(balance==null)balance=am.sign<0?-am.value:am.value;labels=[];continue}
  if(!am){
   if(dt){
    curDate=dt.date;labels=[];
    const rest=cleanLabel(line.replace(dt.re,"").replace(WEEKDAYS,""));
    if(rest.length>=3&&/[a-z]{3}/i.test(rest)&&!NOISE.test(norm(rest))) labels.push(rest);
    continue;
   }
   const c=cleanLabel(line);
   if(c.length>=3&&/[a-z]{2}/i.test(c)&&!NOISE.test(norm(c))) labels.push(c);
   continue;
  }
  let label=cleanLabel(line.replace(am.raw,"").replace(dt?dt.re:/$^/,""));
  if((label.length<3||!/[a-z]{2}/i.test(label))&&labels.length) label=labels[0];
  if(!label||label.length<2) label="Opération";
  const amount=am.sign?am.sign*am.value:(/salaire|paie|virement re[çc]u|remboursement|refund|received/i.test(label)?am.value:-am.value);
  txs.push({date:dt?dt.date:(curDate||todayISO()),label:label.slice(0,80),amount,signGuessed:!am.sign});
  labels=[];
 }
 return {txs,balance};
}

let BANK={status:null,loading:false,error:null},syncing=false,ASPSPS={};
const BAL_PRIO=["CLBD","ITBD","XPCD","CLAV","ITAV","OPBD","OTHR"];
const bankKey=a=>a.iban||a.uid;
const isoDaysAgo=n=>{const d=new Date(Date.now()-n*864e5);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function ago(t){const m=Math.round((Date.now()-t)/60000);if(m<1)return"à l'instant";if(m<60)return`il y a ${m} min`;const h=Math.round(m/60);if(h<24)return`il y a ${h} h`;return`il y a ${Math.round(h/24)} j`}
async function bankApi(path,opt={}){
 if(!S.bank.url||!S.bank.token) throw new Error("Serveur bancaire non configuré");
 let r;
 try{r=await fetch(S.bank.url.replace(/\/+$/,"")+path,{...opt,headers:{"X-Token":S.bank.token,"Content-Type":"application/json",...(opt.headers||{})}})}
 catch(e){throw new Error("Serveur injoignable : vérifie l'adresse et ta connexion")}
 let d={};try{d=await r.json()}catch(e){}
 if(!r.ok) throw new Error(typeof d.error==="string"?d.error:("Erreur "+r.status));
 return d;
}
async function loadBankStatus(){
 BANK.loading=true;BANK.error=null;
 try{BANK.status=await bankApi("/status")}catch(e){BANK.error=e.message}
 BANK.loading=false;if(tab==="settings")render();
}
function pickBalance(list){
 if(!list||!list.length) return null;
 for(const t of BAL_PRIO){const b=list.find(x=>x.balance_type===t);if(b&&isFinite(parseFloat(b.balance_amount?.amount)))return parseFloat(b.balance_amount.amount)}
 const v=parseFloat(list[0].balance_amount?.amount);return isFinite(v)?v:null;
}
function cleanBankLabel(s){
 s=String(s||"").replace(/\b(PAIEMENT PAR CARTE|PAIEMENT CB|CARTE X?\d{4}|CB\*?\d*|PRLV SEPA|PRELEVEMENT SEPA|PRELEVEMENT|VIR SEPA( RECU| EMIS)?|VIR INST( RE| EM)?|FACTURE CARTE DU \d+)\b/gi," ")
  .replace(/\b\d{2}\/\d{2}(\/\d{2,4})?\b/g," ").replace(/\s{2,}/g," ").trim();
 if(!s) return "Opération";
 if(s===s.toUpperCase()) s=s.toLowerCase().replace(/(^|\s|-)\S/g,c=>c.toUpperCase());
 return s.slice(0,80);
}
const dayDiff=(a,b)=>Math.abs((new Date(a+"T12:00")-new Date(b+"T12:00"))/864e5);
async function syncBanks(manual){
 if(syncing||!S.bank.url||!S.bank.token) return;
 if(!Object.values(S.bank.links).some(Boolean)){if(manual)toast("Associe d'abord un compte bancaire à un compte CashFlux");return}
 syncing=true;if(tab==="settings"||tab==="home")render();
 let added=0;const errors=[];
 try{
  const st=await bankApi("/status");BANK.status=st;
  for(const s of st.sessions){
   for(const a of s.accounts){
    const key=bankKey(a),acc=accById(S.bank.links[key]);if(!acc) continue;
    try{
     const from=S.bank.from[key]||isoDaysAgo(90);
     const {transactions=[]}=await bankApi(`/accounts/${encodeURIComponent(a.uid)}/transactions?date_from=${from}`);
     for(const t of transactions){
      if(t.status&&t.status!=="BOOK") continue;
      const raw=parseFloat(t.transaction_amount?.amount);if(!isFinite(raw)||!raw) continue;
      const amount=Math.round((t.credit_debit_indicator==="DBIT"?-Math.abs(raw):t.credit_debit_indicator==="CRDT"?Math.abs(raw):raw)*100)/100;
      const date=String(t.booking_date||t.value_date||t.transaction_date||todayISO()).slice(0,10);
      const rem=Array.isArray(t.remittance_information)?t.remittance_information.join(" "):(t.remittance_information||"");
      const party=amount<0?t.creditor?.name:t.debtor?.name;
      const label=cleanBankLabel(party||rem||t.note||"");
      const ext=key+":"+(t.entry_reference||t.transaction_id||(date+"|"+amount+"|"+rem.slice(0,30)));
      if(S.tx.some(x=>x.extId===ext)) continue;
      const twin=S.tx.find(x=>x.accountId===acc.id&&!x.extId&&Math.abs(x.amount-amount)<0.005&&dayDiff(x.date,date)<=3);
      if(twin){twin.extId=ext;continue}
      S.tx.push({id:uid(),accountId:acc.id,date,label,amount,category:guessCat(label+" "+rem,amount),source:"banque",extId:ext});added++;
     }
     const {balances}=await bankApi(`/accounts/${encodeURIComponent(a.uid)}/balances`);
     const b=pickBalance(balances);if(b!=null) acc.initial+=b-accBalance(acc);
     S.bank.from[key]=isoDaysAgo(10);
    }catch(e){errors.push(acc.name+" : "+e.message)}
   }
  }
  S.bank.lastSync=Date.now();save();
 }catch(e){errors.push(e.message)}
 syncing=false;render();
 if(errors.length) toast(errors[0].slice(0,90));
 else if(manual||added) toast(added?`${added} nouvelle${added>1?"s":""} opération${added>1?"s":""}`:"Comptes à jour");
}

 }

  root.querySelector("#kF").onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();
   r.onload=()=>{pem=String(r.result);const ok=/PRIVATE KEY/.test(pem);root.querySelector("#kMsg").textContent=ok?"Clé lue ✓":"Ce fichier ne ressemble pas à une clé privée .pem";
    const m=f.name.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);if(m)root.querySelector("#kId").value=m[0];root.querySelector("#kGo").disabled=!ok};
   r.readAsText(f)};
  root.querySelector("#kGo").onclick=async()=>{
   const b=root.querySelector("#kGo"),appId=root.querySelector("#kId").value.trim();
   if(!appId){toast("Indique l'identifiant de l'application");return}
   b.disabled=true;b.innerHTML='<span class="spin"></span>&nbsp; Vérification…';
   try{await bankApi("/setup",{method:"POST",body:JSON.stringify({appId,pem})});closeSheet();toast("Clé enregistrée et vérifiée");loadBankStatus()}
   catch(e){b.disabled=false;b.textContent="Envoyer au serveur";root.querySelector("#kMsg").textContent=e.message}
  };
 });
}
async function getAspsps(country){
 if(!ASPSPS[country]){const d=await bankApi("/aspsps?country="+country);ASPSPS[country]=(d.aspsps||[]).filter(a=>!a.psu_types||a.psu_types.includes("personal")).sort((x,y)=>x.name.localeCompare(y.name))}
 return ASPSPS[country];
}
async function connectBank(aspsp){
 const mcv=+aspsp.maximum_consent_validity;
 const days=mcv?Math.max(1,Math.min(180,Math.floor(mcv/86400))):90;
 const d=await bankApi("/connect",{method:"POST",body:JSON.stringify({aspsp:{name:aspsp.name,country:aspsp.country},returnUrl:location.href.split("#")[0],days})});
 location.href=d.url;
}
function formBankAdd(){
 const C=[["FR","France"],["BE","Belgique"],["LU","Luxembourg"],["DE","Allemagne"],["ES","Espagne"],["IT","Italie"],["NL","Pays-Bas"],["PT","Portugal"],["LT","Lituanie (Revolut…)"],["IE","Irlande"]];
 sheet(`<h3>Connecter une banque</h3>
 <div class="f2"><label class="f"><span>Pays de la banque</span><select id="cC">${C.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></label><label class="f"><span>Rechercher</span><input id="cQ" placeholder="Boursorama…" autocorrect="off"></label></div>
 <div id="cL" class="card" style="padding:4px 14px;box-shadow:none;background:var(--surface2);max-height:50vh;overflow:auto"><div class="rs" style="padding:12px 0"><span class="spin"></span>&nbsp; Chargement des banques…</div></div>
 <p class="rs">Tu seras redirigé vers ta banque pour autoriser l'accès en lecture seule, puis ramené dans CashFlux.</p>`,root=>{
  let list=[];
  const draw=()=>{const q=norm(root.querySelector("#cQ").value);const f=list.filter(a=>!q||norm(a.name).includes(q)).slice(0,80);
   root.querySelector("#cL").innerHTML=f.length?f.map(a=>`<button class="rowbtn" data-bank="${esc(a.name)}"><div class="row"><div class="av">${a.logo?`<img src="${esc(a.logo)}" alt="" style="width:26px;height:26px;object-fit:contain;border-radius:6px">`:"🏦"}</div><div class="rmain"><div class="rt">${esc(a.name)}</div></div></div></button>`).join(""):`<div class="rs" style="padding:12px 0">Aucune banque trouvée</div>`;
   root.querySelectorAll("[data-bank]").forEach(b=>b.onclick=async()=>{const a=list.find(x=>x.name===b.dataset.bank);b.innerHTML=`<div class="row"><span class="spin"></span>&nbsp; Redirection vers ${esc(a.name)}…</div>`;try{await connectBank(a)}catch(e){toast(e.message.slice(0,90));draw()}})};
  const load=async()=>{const c=root.querySelector("#cC").value;try{list=await getAspsps(c);draw()}catch(e){root.querySelector("#cL").innerHTML=`<div class="rs" style="padding:12px 0">${esc(e.message)}</div>`}};
  root.querySelector("#cC").onchange=load;root.querySelector("#cQ").oninput=draw;load();
 });
}
async function renewBank(name,country){
 try{const list=await getAspsps(country);const a=list.find(x=>x.name===name)||{name,country};toast("Redirection vers "+name+"…");await connectBank({...a,country})}
 catch(e){toast(e.message.slice(0,90))}
}
/* Retour depuis la banque */
(function(){
 const h=location.hash;if(!h.startsWith("#bank="))return;
 const q=new URLSearchParams(h.slice(1));history.replaceState(null,"",location.pathname+location.search);
 tab="settings";
 setTimeout(()=>toast(q.get("bank")==="ok"?"Banque connectée : associe ses comptes ci-dessous":"Connexion échouée : "+(q.get("msg")||"réessaie").slice(0,70)),500);
})();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;maybeSync();if(tab==="settings"&&S.bank.url){BANK={status:BANK.status,loading:false,error:null};loadBankStatus()}});

/* ---------- Événements ---------- */
document.addEventListener("click",ev=>{
 const el=ev.target.closest("[data-tab],[data-act],[data-pick-tx],[data-hcard],[data-open-acc],[data-edit-tx],[data-edit-rec],[data-edit-goal],[data-months],[data-close]");if(!el)return;
 if(el.dataset.close!==undefined){closeSheet();return}
 if(el.dataset.tab){go(el.dataset.tab);return}
 if(el.dataset.pickTx){const t=S.tx.find(x=>x.id===el.dataset.pickTx);if(t){const ctx=document.querySelector("#sheetRoot.open")&&todoCtx?todoCtx:null;todoCtx=null;formPick(t,ctx?()=>formTodo(ctx.accId):null)}return}
 if(el.dataset.hcard){
  if(reorderMode||Date.now()<suppressClick)return;
  if(el.dataset.hcard!==homeSel){centerCard(el,true);return}
  if(el.dataset.hcard==="all"){go("accounts");return}
  tab="accounts";openAcc=el.dataset.hcard;render();window.scrollTo({top:0});return}
 if(el.dataset.openAcc){tab="accounts";openAcc=el.dataset.openAcc;render();window.scrollTo({top:0});return}
 if(el.dataset.editTx){todoCtx=null;formTx(S.tx.find(t=>t.id===el.dataset.editTx));return}
 if(el.dataset.editRec){formRec(S.recurring.find(r=>r.id===el.dataset.editRec));return}
 if(el.dataset.editGoal){formGoal(S.goals.find(g=>g.id===el.dataset.editGoal));return}
 if(el.dataset.months){S.settings.months=+el.dataset.months;save();render();return}
 const a=el.dataset.act,id=el.dataset.id;
 ({import:()=>formImport(id||openAcc),addtx:()=>formTx(null,id||openAcc),transfer:formTransfer,addrec:()=>formRec(null,el.dataset.kind),addacc:()=>formAccount(),
   editacc:()=>formAccount(accById(id)),backacc:()=>{openAcc=null;render()},setbal:()=>formSetBal(accById(id)),addgoal:()=>formGoal(),
   subadd:()=>formRec(null,"charge",S.tx.find(t=>t.id===id)),export:exportData,restore:()=>document.getElementById("backupIn").click(),
   reorder:()=>{reorderMode=true;render()},todo:()=>formTodo(id),cats:formCats,catmonth:()=>formCatMonth(id),reodone:()=>{reorderMode=false;render()},
   mvl:()=>moveAcc(id,-1),mvr:()=>moveAcc(id,1),
   bankcfg:formBankCfg,bankkey:formBankKey,bankadd:formBankAdd,bankretry:()=>{BANK={status:null,loading:false,error:null};loadBankStatus();render()},
   bankrenew:()=>renewBank(el.dataset.name,el.dataset.country),sync:()=>syncBanks(true),
   bankdel:async()=>{if(!confirm("Déconnecter cette banque ? Les opérations déjà importées sont conservées."))return;try{await bankApi("/sessions/"+encodeURIComponent(id),{method:"DELETE"});toast("Banque déconnectée")}catch(e){toast(e.message)}loadBankStatus()},
   reset:()=>{if(confirm("Effacer tous les comptes, opérations et réglages ?")){S=blank();save();go("home")}}})[a]?.();
});
document.addEventListener("input",ev=>{
 if(ev.target.id==="saveRate"){S.settings.savingsRate=+ev.target.value;clearTimeout(window._sr);window._sr=setTimeout(()=>{save();render()},120)}
 if(ev.target.dataset.link!==undefined){const k=ev.target.dataset.link;if(ev.target.value)S.bank.links[k]=ev.target.value;else delete S.bank.links[k];delete S.bank.from[k];save();toast(ev.target.value?"Compte associé":"Compte dissocié")}
 if(ev.target.dataset.weight){S.settings.weights[ev.target.dataset.weight]=Math.max(0,+ev.target.value||0);save()}
});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closeSheet();if(ev.key==="Enter"&&ev.target.matches?.('[role="button"]'))ev.target.click()});
document.getElementById("eyeBtn").onclick=()=>{S.settings.hide=!S.settings.hide;save();render()};

render();
setTimeout(maybeSync,800);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
